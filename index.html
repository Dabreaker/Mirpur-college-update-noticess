<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirpur College Updates & Notices</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Sleek Modern Background Grid & Glow Pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            z-index: -2;
        }

        /* Ambient glowing background blur effect */
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Layout wrapper */
        .content-box {
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 1;
        }

        /* Big Centered Main Text */
        h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
            color: #ededed;
        }

        /* Link/Text styling */
        .real-link {
            font-size: clamp(1rem, 2vw, 1.35rem);
            font-weight: 600;
            color: #a1a1aa;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-block;
        }

        .real-link:hover {
            color: #ffffff;
            transform: translateY(-2px);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="content-box">
        <h1>Ja gia putki mara bainchod 🖕🖕🖕</h1>
        <a href="Https://mirpur-college-updates-notices.vercel.app/" target="_blank" class="real-link">
            Real link eikhane -Mirpur College Updates & Notices
        </a>
    </div>

</body>
</html>
