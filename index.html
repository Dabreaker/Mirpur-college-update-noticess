<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Text with Link</title>
    <style>
        body {
            /* Ensures the body takes up the full height of the screen */
            height: 100vh;
            margin: 0;
            /* Uses flexbox to center content both vertically and horizontally */
            display: flex;
            flex-direction: column; /* Stack items vertically */
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }

        h1 {
            /* Makes the text nice and big */
            font-size: 4rem;
            color: #333;
            margin-bottom: 20px; /* Space between the text and the link */
        }

        a {
            font-size: 1.2rem;
            color: #0066cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline; /* Underline on hover for better UX */
        }
    </style>
</head>
<body>

    <h1> Ja gia putki mara bainchod 🖕🖕🖕</h1>
    <a href="Https://mirpur-college-updates-notices.vercel.app/" target="_blank">Real link eikhane -Mirpur College Updates & Notices</a>

</body>
</html>
