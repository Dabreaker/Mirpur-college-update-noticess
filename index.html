<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirpur College Updates & Notices</title>
    <!-- Inter Font for Clean Minimalist Look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #09090b;
            --surface: #121215;
            --surface-hover: #18181b;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #ededed;
            --text-secondary: #88888d;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        /* Minimalist Advanced Wrapper */
        .wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 36px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            transition: border-color 0.4s ease;
        }

        .wrapper:hover {
            border-color: var(--border-hover);
        }

        /* Subtle Ambient Glow Effect */
        .wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--text-primary), transparent);
            opacity: 0.3;
        }

        /* Status Indicator Dot */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 24px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        /* Minimalist Headings */
        h1 {
            font-size: 1.65rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.4;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        /* Description text */
        p {
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 36px;
        }

        /* Advanced Minimal Button */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: var(--text-primary);
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-link:hover {
            background: #202025;
            border-color: var(--text-primary);
            transform: translateY(-2px);
        }

        .btn-link svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            transition: transform 0.25s ease;
        }

        .btn-link:hover svg {
            transform: translate(2px, -2px);
        }

        /* Minimal Footer info */
        .footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #55555b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Status -->
        <div class="status-pill">
            <span class="dot"></span> System Live
        </div>

        <!-- Main Title -->
        <h1>Ja gia putki mara bainchod 🖕🖕🖕</h1>

        <!-- Subtext -->
        <p>Real link eikhane - Mirpur College Updates & Notices</p>

        <!-- Minimal Navigation Action -->
        <a href="Https://mirpur-college-updates-notices.vercel.app/" target="_blank" class="btn-link">
            <span>Open Notice Portal</span>
            <svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </a>

        <div class="footer">
            Secure Redirection Portal
        </div>
    </div>

</body>
</html>
